name: Kila Shorts

on:
  workflow_dispatch:
    inputs:
      url:
        description: YouTube video URL
        required: true
        type: string
      style:
        description: Caption style
        required: true
        default: hormozi
        type: choice
        options: [default, hormozi, mrbeast, podcast]
      max_clips:
        description: Number of clips (1-5)
        required: true
        default: "3"
        type: string
      min_duration:
        description: Minimum seconds (15, 20, 30)
        required: true
        default: "20"
        type: string
      max_duration:
        description: Maximum seconds (30, 45, 60)
        required: true
        default: "60"
        type: string
      tighten:
        description: Remove filler and pauses
        required: true
        default: true
        type: boolean
      loudnorm:
        description: Normalize audio
        required: true
        default: true
        type: boolean
  issues:
    types: [opened]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: kila-shorts-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  render:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      (github.event_name == 'issues' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
       (github.event.issue.title == '[SHORT JOB] Auto clip' ||
        github.event.issue.title == '[CHANNEL WATCH] Configure'))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHOPIFY_REV: 99fa3e3d81be7ce35debf1e302a5c5da75f53f62
      BGUTIL_POT_VERSION: "2.0.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install FFmpeg and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libgl1 libglib2.0-0

      - name: Set up Deno for YouTube JavaScript challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install pinned Chopify requirements and current yt-dlp
        run: |
          git clone --filter=blob:none https://github.com/mehbul/chopify.git "$RUNNER_TEMP/chopify"
          git -C "$RUNNER_TEMP/chopify" checkout --detach "$CHOPIFY_REV"
          python -m pip install --upgrade pip
          python -m pip install -r "$RUNNER_TEMP/chopify/requirements.txt"
          python -m pip install --upgrade 'yt-dlp[default]'
          python -m pip install "bgutil-ytdlp-pot-provider==${BGUTIL_POT_VERSION}"
          echo "CHOPIFY_DIR=$RUNNER_TEMP/chopify" >> "$GITHUB_ENV"
          echo "Chopify revision: $(git -C "$RUNNER_TEMP/chopify" rev-parse HEAD)"
          yt-dlp --version
          deno --version

      - name: Prepare optional YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [[ -n "${YOUTUBE_COOKIES:-}" ]]; then
            cookies_file="$RUNNER_TEMP/youtube-cookies.txt"
            printf '%s\n' "$YOUTUBE_COOKIES" > "$cookies_file"
            chmod 600 "$cookies_file"
            echo "YOUTUBE_COOKIES_FILE=$cookies_file" >> "$GITHUB_ENV"
            echo "Configured a temporary YouTube cookie file."
          else
            echo "No YouTube cookie secret configured; continuing without cookies."
          fi

      - name: Start YouTube PO-token provider
        run: |
          set -euo pipefail
          docker rm -f kila-bgutil-pot >/dev/null 2>&1 || true
          docker pull "brainicism/bgutil-ytdlp-pot-provider:${BGUTIL_POT_VERSION}"
          docker run --rm -d --init --name kila-bgutil-pot \
            -p 127.0.0.1:4416:4416 \
            "brainicism/bgutil-ytdlp-pot-provider:${BGUTIL_POT_VERSION}"
          ready=0
          for attempt in {1..30}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/4416' 2>/dev/null; then
             ready=1
              break
            fi
           sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            docker logs kila-bgutil-pot || true
            echo "PO-token provider failed to start" >&2
            exit 1
          fi
          docker logs kila-bgutil-pot || true

      - name: Configure yt-dlp for current YouTube checks
        run: |
          set -euo pipefail
          config_dir="$HOME/.config/yt-dlp"
          config_file="$config_dir/config"
          mkdir -p "$config_dir"
          cat > "$config_file" <<'EOF'
          --retries 5
          --fragment-retries 5
          --extractor-retries 3
          --sleep-requests 1
          --force-ipv4
          --extractor-args "youtube:player-client=mweb"
          --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416"
          EOF
          if [[ -n "${YOUTUBE_COOKIES_FILE:-}" ]]; then
            printf '%s\n' "--cookies $YOUTUBE_COOKIES_FILE" >> "$config_file"
          fi
          echo "yt-dlp runtime configuration:"
          sed -E 's#(--cookies ).*#\1<temporary-file>#' "$config_file"
          yt-dlp --version
          deno --version

      - name: Validate job, render and publish
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.event.repository.default_branch || github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python scripts/run_workflow.py

      - name: Clean up YouTube runtime
        if: always()
        run: |
          docker rm -f kila-bgutil-pot >/dev/null 2>&1 || true
          rm -f -- "$HOME/.config/yt-dlp/config"
          if [[ -n "${YOUTUBE_COOKIES_FILE:-}" ]]; then
            rm -f -- "$YOUTUBE_COOKIES_FILE"
          fi
